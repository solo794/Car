name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest already ships an Android SDK (ANDROID_HOME is set).
      # android-actions/setup-android@v3 now fails trying to install the
      # removed "tools" package, so it is not used.
      - name: Show Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shine-launcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Also publish the APK as a release asset: unlike workflow artifacts,
      # release files have a direct download link (no GitHub sign-in needed
      # on a public repo), which is easier to open from a phone.
      - name: Copy APK with a stable name
        run: cp app/build/outputs/apk/debug/app-debug.apk shine-launcher.apk

      - name: Publish to the "latest-apk" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Shine Launcher (latest build)
          prerelease: true
          body: |
            آخر نسخة اتبنت تلقائياً من الفرع ${{ github.ref_name }}
            commit: ${{ github.sha }}
          files: shine-launcher.apk

      # Off-device screenshots of the dashboard (Paparazzi) for design review.
      - name: Render UI screenshots
        id: snapshots
        continue-on-error: true
        run: ./gradlew recordPaparazziDebug --stacktrace && mkdir -p ui-preview && cp app/src/test/snapshots/images/*.png ui-preview/

      - name: Publish UI screenshots
        if: steps.snapshots.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ui-preview
          name: UI preview (latest build)
          prerelease: true
          body: Dashboard screenshots rendered by Paparazzi from ${{ github.sha }}
          files: ui-preview/*.png
